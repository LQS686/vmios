plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.vmios.sweetvm'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.vmios.sweetvm'
        minSdk 26
        // Keep 28: Android 10+ rejects exec from app data for targetSdk >= 29,
        // and jniLibs cannot carry Termux's versioned SONAMEs. The engine is
        // extracted unchanged and executed from filesDir (see EngineAssets).
        targetSdk 28
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/*']
        }
    }

    androidResources {
        noCompress += ['bin', 'img']
    }
}
